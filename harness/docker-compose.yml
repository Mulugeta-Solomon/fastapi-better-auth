# Conformance harness: a real, version-pinned Better Auth server for e2e tests
# and golden-vector capture. See harness/README.md.
services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Default topology: sessions in Postgres only.
  auth:
    build:
      context: ./auth-server
      args:
        BETTER_AUTH_VERSION: ${BETTER_AUTH_VERSION:-}
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness
      BETTER_AUTH_SECRET: harness-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:3100
      PORT: "3100"
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3100/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

  # Secondary-storage topology: sessions live in Redis (raw-token keys); the
  # Postgres session table may stay empty. Started only with --profile redis.
  auth-redis:
    profiles: ["redis"]
    build:
      context: ./auth-server
      args:
        BETTER_AUTH_VERSION: ${BETTER_AUTH_VERSION:-}
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness
      BETTER_AUTH_SECRET: harness-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:3101
      PORT: "3101"
      REDIS_URL: redis://redis:6379
    ports:
      - "3101:3101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
