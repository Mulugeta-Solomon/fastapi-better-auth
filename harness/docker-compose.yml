# Conformance harness: a real, version-pinned Better Auth server for e2e tests
# and golden-vector capture. See harness/README.md.
#
# Every published port binds 127.0.0.1 only: the harness ships a fixed database password and
# auth secret, so nothing on it should be reachable from another machine. Each HOST port comes
# from a HARNESS_*_PORT variable; the defaults sit below 32768 because Linux hands out
# 32768-60999 to outgoing connections and Windows reserves blocks of its dynamic range for
# Hyper-V, either of which can already hold a port up there. Container ports never change. An
# auth server's BETTER_AUTH_URL follows its host port, because Better Auth trusts only its own
# baseURL origin and clients on the host send that host-side origin. Images are pinned
# as `tag@sha256:digest` - the digest is what Docker pulls, the tag is what a reader and
# Dependabot (docker-compose ecosystem) read.
services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: harness
      POSTGRES_DB: harness
    ports:
      - "127.0.0.1:${HARNESS_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harness"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    ports:
      - "127.0.0.1:${HARNESS_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Default topology: sessions in Postgres only.
  auth:
    build:
      context: ./auth-server
      args:
        BETTER_AUTH_VERSION: ${BETTER_AUTH_VERSION:-}
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness
      BETTER_AUTH_SECRET: harness-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:${HARNESS_AUTH_PORT:-3100}
      PORT: "3100"
    ports:
      - "127.0.0.1:${HARNESS_AUTH_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3100/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy

  # Secondary-storage topology: sessions live in Redis (raw-token keys); the
  # Postgres session table may stay empty. Started only with --profile redis.
  auth-redis:
    profiles: ["redis"]
    build:
      context: ./auth-server
      args:
        BETTER_AUTH_VERSION: ${BETTER_AUTH_VERSION:-}
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness
      BETTER_AUTH_SECRET: harness-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:${HARNESS_AUTH_REDIS_PORT:-3101}
      PORT: "3101"
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${HARNESS_AUTH_REDIS_PORT:-3101}:3101"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3101/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Both containers run `auth migrate` against the same database on start; waiting for
      # the first to be serving is what keeps the two migrations from racing each other.
      auth:
        condition: service_healthy

  # Strict bearer posture: bearer({ requireSignature: true }), so a dot-less bearer token is
  # ignored instead of self-signed. Started only with --profile strict.
  auth-strict:
    profiles: ["strict"]
    build:
      context: ./auth-server
      args:
        BETTER_AUTH_VERSION: ${BETTER_AUTH_VERSION:-}
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness
      BETTER_AUTH_SECRET: harness-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:${HARNESS_AUTH_STRICT_PORT:-3102}
      PORT: "3102"
      BEARER_REQUIRE_SIGNATURE: "1"
    ports:
      - "127.0.0.1:${HARNESS_AUTH_STRICT_PORT:-3102}:3102"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3102/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy

  # Rate-limited posture: an explicit `enabled: true` rule of 3 requests / 10 s on
  # /get-session, so the 429 path can be proven against a real server. NODE_ENV is never set
  # to production here - that would also flip the cookie name to __Secure- over http.
  # Started only with --profile throttled.
  auth-throttled:
    profiles: ["throttled"]
    build:
      context: ./auth-server
      args:
        BETTER_AUTH_VERSION: ${BETTER_AUTH_VERSION:-}
    environment:
      DATABASE_URL: postgres://harness:harness@postgres:5432/harness
      BETTER_AUTH_SECRET: harness-secret-do-not-use-in-production
      BETTER_AUTH_URL: http://localhost:${HARNESS_AUTH_THROTTLED_PORT:-3103}
      PORT: "3103"
      RATE_LIMIT_GET_SESSION_MAX: "3"
    ports:
      - "127.0.0.1:${HARNESS_AUTH_THROTTLED_PORT:-3103}:3103"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3103/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
