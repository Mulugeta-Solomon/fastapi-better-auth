name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Sync (dev group)
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Build
        run: uv build
      - name: Wheel must ship py.typed
        run: unzip -l dist/fastapi_better_auth_bridge-*.whl | grep -q "fastapi_better_auth/py.typed"
      - name: Test
        run: uv run pytest -q

  types:
    name: pyright strict (py3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync (dev group)
        run: uv sync
      - name: Pyright (strict, src + tests)
        run: uv run pyright

  os:
    name: unit (${{ matrix.os }}, py3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync (dev group)
        run: uv sync
      - name: Test (unit lane)
        run: uv run pytest -q

  floors:
    # Every other lane installs the lockfile, which pins the newest compatible versions,
    # so the declared floors are never actually exercised. This lane installs them.
    name: unit (declared floors, py3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - name: Resolve every direct dependency to its declared floor
        run: uv lock --resolution lowest-direct
      - name: Sync (dev group)
        run: uv sync --frozen
      - name: Test (unit lane)
        run: uv run --frozen pytest -q

  prerelease:
    # Advisory only: a red here never blocks a merge. uv resolves "3.15" to the newest
    # 3.15 pre-release because no stable 3.15 exists yet.
    name: unit (py3.15 pre-release, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.15"
      - name: Sync (dev group)
        run: uv sync
      - name: Test (unit lane)
        run: uv run pytest -q

  e2e:
    name: e2e conformance + combined coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Start harness (both topologies)
        # --profile redis brings up auth-redis on :3101 alongside the default :3100 server.
        # Both gate: the stores answer two different truths and only one of them is Postgres.
        run: docker compose -f harness/docker-compose.yml --profile redis up --build -d --wait
      - name: Sync (dev group)
        run: uv sync
      - name: Unit lane (coverage, no gate)
        run: uv run pytest -q --cov=fastapi_better_auth --cov-append
      - name: Conformance lane (gate on combined unit + e2e coverage)
        run: uv run pytest -m e2e -q --cov=fastapi_better_auth --cov-append --cov-fail-under=80
      - name: Harness logs
        if: failure()
        run: docker compose -f harness/docker-compose.yml --profile redis logs
      - name: Teardown
        if: always()
        run: docker compose -f harness/docker-compose.yml --profile redis down -v
