name: canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  conformance:
    name: better-auth@${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.6.30", "1.7.1", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Start harness (better-auth@${{ matrix.version }})
        run: BETTER_AUTH_VERSION=${{ matrix.version }} docker compose -f harness/docker-compose.yml up --build -d --wait
      - name: Sync (dev group)
        run: uv sync
      - name: Conformance lane
        run: uv run pytest -m e2e -q
      - name: Harness logs
        if: failure()
        run: docker compose -f harness/docker-compose.yml logs
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="canary: conformance failure against better-auth@${{ matrix.version }}"
          gh label create canary --color D93F0B --description "automated conformance canary" 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label canary --json title --jq ".[].title" | grep -Fx "$TITLE" || true)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --label canary --body "The e2e conformance lane failed against better-auth@${{ matrix.version }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

  published-wheel:
    # The wheel users actually install, from the index, against the same harness matrix.
    # Nothing here may install the checkout: no `uv sync`, no `uv run`, no editable install.
    name: published wheel vs better-auth@${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.6.30", "1.7.1", "latest"]
    env:
      # Never `.venv`: uv adopts that name as the project environment.
      WHEEL_VENV: .venv-published-wheel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Start harness (better-auth@${{ matrix.version }})
        run: BETTER_AUTH_VERSION=${{ matrix.version }} docker compose -f harness/docker-compose.yml up --build -d --wait
      - name: Install the published wheel and the conformance lane's test dependencies
        run: |
          uv venv --python 3.13 "$WHEEL_VENV"
          uv pip install --python "$WHEEL_VENV/bin/python" --refresh \
            "fastapi-better-auth-bridge[httpx,httpx2]" "pytest>=8" "trio>=0.27"
      - name: Instrument liveness — the library under test must be the installed wheel
        id: guard
        run: |
          "$WHEEL_VENV/bin/python" .github/scripts/assert_published_wheel.py
      - name: Conformance lane (published wheel)
        id: conformance
        run: |
          "$WHEEL_VENV/bin/python" -m pytest tests/e2e -m e2e -q
      - name: Harness logs
        if: failure()
        run: docker compose -f harness/docker-compose.yml logs
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          WHEEL_VERSION: ${{ steps.guard.outputs.version || 'unknown' }}
          CONFORMANCE_OUTCOME: ${{ steps.conformance.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$CONFORMANCE_OUTCOME" = "failure" ]; then
            TITLE="canary: published wheel ${WHEEL_VERSION} fails conformance against better-auth@${{ matrix.version }}"
            BODY="fastapi-better-auth-bridge ${WHEEL_VERSION}, installed from PyPI, failed the e2e conformance lane against better-auth@${{ matrix.version }}. This is the artifact users have, not HEAD. Run: ${RUN_URL}"
          else
            TITLE="canary: published-wheel lane cannot run against better-auth@${{ matrix.version }}"
            BODY="The published-wheel lane failed before it tested anything - harness startup, the PyPI install, or the instrument-liveness guard. Until this is fixed the lane proves nothing about the shipped wheel. Run: ${RUN_URL}"
          fi
          gh label create canary --color D93F0B --description "automated conformance canary" 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label canary --limit 100 --json title --jq ".[].title" | grep -Fx "$TITLE" || true)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --label canary --body "$BODY"
          fi
