name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Build distributions
        run: uv build --no-sources
      - name: Guard — git tag must equal the built wheel's version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          WHEEL=$(ls dist/*.whl)
          case "$WHEEL" in
            *"-${TAG}-"*) echo "tag ${TAG} matches wheel ${WHEEL}" ;;
            *) echo "::error::tag ${TAG} does not match built wheel ${WHEEL}"; exit 1 ;;
          esac
      - name: Guard — wheel must ship py.typed
        run: unzip -l dist/fastapi_better_auth_bridge-*.whl | grep -q "fastapi_better_auth/py.typed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Mandatory for PyPI Trusted Publishing (OIDC). No token is configured anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
